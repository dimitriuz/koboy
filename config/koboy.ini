# koboy configuration. Every key below is set to its built-in default, so
# deleting this file changes nothing. Lines starting with # are ignored.
#
# Four keys are also reachable in-game from MENU, which writes your choice
# back here: FRAMES (present_divisor), GREYSCALE (gray_map), MOTION
# (force_dither + waveform_fast) and the screenshot counter's directory.

# ============================================================ where things are
# Paths with no "/" are resolved against the folder koboy lives in, NOT the
# current directory -- a NickelMenu launch does not set one.

# Where the browser looks for games. Subfolders are browsed, not flattened.
rom_dir = roms

# Where .srm cartridge saves and save states go.
save_dir = .

# Where MENU -> SCREENSHOT writes its PNGs.
shot_dir = screenshots

# ================================================================== the picture

# 0 = auto-fit the largest scale that fits ABOVE the controls. Each system also
# has its own measured ceiling (see `ceiling`, src/config.c).
# THE 5 HERE DOES NOT COUNT AS ASKING: 5 is the legacy default and a file
# naming exactly it is treated as unedited. Any other number wins.
scale = 5

# 1-BIT OUTPUT. On by default, and it is the most important setting here.
# The panel's fast waveforms are TWO-LEVEL: they drive a pixel to black or to
# white. Asking for a mid grey at partial-refresh speed lands between the two,
# which is what left a smear behind every moving sprite. Dithered to 1 bit,
# every transition is one the panel can finish.
# Turn it off if you prefer four flat greys on a mostly static system -- the
# Game Boy's own four shades ARE the panel's four levels, so it is the one
# system that asks for nothing it cannot already do.
force_dither = true

# Waveform for fast (non-flashing) updates: auto or du or du4.
# Leave it on auto. Measured: on 1-bit content auto already selects DU, to
# within 0.5 ms at three region sizes, and forced du4 is the FOUR-level variant
# that cannot erase -- the original cause of the smearing above.
waveform_fast = auto

# How colour becomes four greys: balanced, luma, equal, value, bright.
# balanced = weights (81,118,57) plus a shadow lift. luma is Rec.601, what v1
# shipped: it weights blue 29/256, so a bright blue sky lands on the DARKEST
# level. value puts saturated colour at white and can lose a white HUD.
gray_map = balanced

# Honour the pixel aspect a core reports. Most systems are NOT square: Atari
# 2600 is ~1.6:1 (renders 1.75x too tall without this), NES and Master System
# 8:7, Game Gear 6:5. Correcting them costs whole-number pixel steps.
# Set false to put every system back to square-pixel scaling.
pixel_aspect = true

# =================================================== how often the panel redraws

# Core frames per presented frame. Does NOT change how fast a game runs -- the
# core is paced at its own rate -- only how many UPDATES the panel gets. E-ink
# residue accumulates per update, so higher smears less and moves choppier.
# Measured (Libra 2, 600 frames, wall clock identical throughout):
#   divisor    1     2     3     4     6     8    12
#   fps      11.2   9.9   7.4   6.5   4.8   3.8   3.0
# Range 1-8. Out-of-range or non-numeric is REJECTED, not clamped: clamping a
# typo'd 0 to 1 would hand you the worst-smearing setting there is.
present_divisor = 3

# AREA-AWARE PACING. present_divisor alone paces by frame COUNT, so a two-tile
# sprite update and a full-screen scroll are treated alike though they cost the
# panel wildly different time. These charge a settle time proportional to the
# area just sent and hold the next present until it elapses.
# Measured on this panel: a full 800x720 rect takes 153.5 ms to settle.
# settle_full_ms is that cost for a full rect; settle_base_ms is charged to
# every update regardless. Base stays 0 deliberately -- charging the real fixed
# cost to everything would pin the device to 6.5 fps on menus too. Raise it
# toward 145 if half-screen changes still flash, and expect more choppiness.
# Both clamp to 0-1000 rather than rejecting. 0 in settle_full_ms disables.
settle_base_ms = 0
settle_full_ms = 150

# Fixed per-refresh cost in 8x8 tiles, used to decide whether splitting one
# dirty rect into several beats refreshing their merged box. Raise to split
# less; a very large value never splits. Does nothing for a full-screen
# scroller -- that is the panel's answer, not the algorithm's.
# UNVALIDATED: 40 is a starting guess, not a measurement.
refresh_fixed_tiles = 40

# ==================================== the flashing controls, off on purpose
# BOTH OF THESE ARE DISABLED DELIBERATELY, and this is not an oversight.
# They schedule a flashing full refresh, which was necessary when the fast
# waveform was a forced DU4 that could not erase. With waveform_fast = auto the
# driver already picks a waveform that erases when one is needed, so they are
# redundant -- and measured on a Libra 2 they CAUSED every flash seen in a
# traced run while fixing nothing. Re-enabling them brings the flashing back.

# Presented frames between game-rect cleanups. 0 or less = off.
cleanup_interval = 0

# Wall-clock ceiling in ms between cleanups. 0 or less = off.
cleanup_max_ms = 0

# Dirty area (permille of the game rect) above which a frame is refreshed with
# a FLASHING full refresh instead of the fast waveform. 1000 = never.
full_refresh_permille = 1000

# ==================================================================== controls

# Take exclusive control of the touchscreen and buttons while running.
grab_input = true

# Touch d-pad behaviour: cross (tap a zone to steer) or relative (first touch
# sets the origin, movement from it steers).
dpad_mode = cross

# Pixels of movement before a relative d-pad reports a direction, and the
# hysteresis that stops it flickering between two directions on the boundary.
dpad_deadzone = 24
dpad_hysteresis = 10

# ==================================================== rarely edited by hand
# key_a, key_b, key_select, key_start -- evdev codes for the page-turn keys.
#   koboy appends key_a/key_b here itself after the first-run calibration; the
#   verified Libra 2 came out as key_a = 194, key_b = 193, i.e. the opposite
#   way round from the shipped pair, which is why calibration exists.
# menu_cx, menu_cy, menu_w, menu_h -- position and size of the drawn MENU zone,
#   in permille of the panel. Moving it also moves its touch target.
# rom -- a ROM path to launch directly, skipping the browser.
