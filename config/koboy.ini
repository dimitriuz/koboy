# koboy default configuration
# Each key can be set to override the default values

# Display scale (0 = auto-fit to the largest integer scale that fits the panel
# ABOVE THE CONTROLS -- the drawn d-pad, A/B and Start/Select need their own
# band, and a rect fitted to the bare panel covered them while their touch zones
# stayed live underneath, so tapping the lower playfield pressed A)
scale = 5

# Core frames per presented frame
present_divisor = 3

# Presented frames between game-rect cleanups (0 or less disables).
# DISABLED BY DEFAULT, and deliberately so rather than by oversight. This and
# full_refresh_permille below both exist to schedule a flashing GC16, which was
# necessary when the fast waveform was a forced DU4: DU4 cannot erase, so
# residue built up and only a flash cleared it. With waveform_fast = auto the
# EPDC driver inspects each region's real pixel transitions and already picks a
# waveform that can erase when one is needed, which makes both redundant.
# Measured on a Libra 2: in one traced run, 35 AUTO refreshes on small rects
# flashed not once, while all 21 flashes came from the old 450-permille
# threshold below -- and no scheduled cleanup ever fired. With both off, a full
# game played with no flashing at all and only slight ghosting.
# Raise this if you want the periodic flash back; 60 was the old default and is
# roughly 2.4s at ~25fps.
cleanup_interval = 0

# Wall-clock ceiling between cleanups, in milliseconds (0 or less disables).
# Only relevant if you re-enable the cleanup above. It exists because
# cleanup_interval alone cannot promise any particular schedule: unchanged
# frames are suppressed by the dirty-rect pass, and 70s of measured Tetris
# gameplay presented only 45 frames -- so 60 presented frames is ~90s and a
# short session would never clean at all. Whichever limit trips first wins.
cleanup_max_ms = 0

# Waveform for fast (per-frame) refreshes: "auto" or "du4".
#   auto - let the EPDC driver pick. It inspects the actual pixel transitions in
#          each update region, so it knows when an update is *erasing* (dark to
#          light) and needs a waveform capable of it. This is why the falling
#          piece left a second copy of itself behind under forced du4.
#   du4  - force the fast non-flashing waveform. Measurably quicker to submit,
#          but it cannot erase, so trails accumulate until a cleanup.
waveform_fast = auto

# Dirty area, in permille of the game rect, at or above which a frame is
# refreshed with the full (flashing) waveform instead of the fast one.
# Measured against the TOTAL area of every rect a frame emits (up to
# KOBOY_MAX_RECTS of them, since Task 13), not one merged box. These rects
# are NOT guaranteed disjoint (a capped merge can leave one containing
# another -- see the comment above the merge-cap in video_split_dirty,
# src/video.c), so summed area is not simply bounded by the game rect's area
# through non-overlap. It is still bounded, for a different reason: the split
# branch only ever fires when Sum(tiles_i) < tiles_merged (strict). For the
# shipped default (the Game Boy core: game_w = 160*scale, game_h = 144*scale,
# always multiples of 8/KOBOY_TILE) that bound is exact:
# Sum(area_i) <= 64*Sum(tiles_i) < 64*tiles_merged <= game_w*game_h -- a core
# whose max_w/max_h are not themselves multiples of 8 (src/config.c now
# derives game_w/game_h from the core's geometry, not a 160x144 constant)
# only loses the LAST inequality by at most one edge tile's worth of slack,
# so the practical conclusion below still stands, but is no longer a proof
# for every possible core the way it is for this one. So
# 1000 still means "the promotion fires only when the summed dirty area
# covers the game rect corner to corner" -- reachable only via the single
# merged rect (empirically confirmed: the max summed area measured across a
# large randomised sweep was exactly game_w*game_h, and only the merged-rect
# path produced it). That is reachable -- a full-screen wipe or a scene
# transition produces exactly it -- but normal gameplay essentially never
# does, and when the whole rect really has changed a flashing refresh is what
# you want. (Only *exceeding* the rect is impossible, so 1001 and up would be
# a true never.)
# This threshold, not the cleanup above, was the measured source of the flashing
# users complained about: every flash in a traced run came from it. It was
# written for forced DU4, which cannot erase; AUTO can, so the promotion has
# nothing left to fix. Lower it (450 was the old default) only if you can
# actually see residue the driver failed to clear.
full_refresh_permille = 1000

# The fixed per-refresh cost, expressed in 8x8 tiles, used to decide whether
# splitting one dirty rectangle into several is cheaper than refreshing their
# merged bounding box. Refresh cost on e-ink is roughly `fixed + area`, so a
# sprite in one corner and a status bar in another merge into a near-full-rect
# refresh whose interior never changed.
# This is a config key rather than a constant because every absolute timing
# figure this project has measured moved by up to a factor of 2.2 between
# sessions. Raise it to split less; a very large value never splits.
# NOTE: this does nothing for a full-screen scroller. That case is the panel's
# answer, not the algorithm's, and no rectangle strategy improves it.
# UNVALIDATED ON HARDWARE: 40 is a starting guess, not a measurement -- see
# the note beside refresh_fixed_tiles in config_defaults (src/config.c). The
# on-device tuning run (koboy.log's `stages` line and `rects` count at
# 20/40/80) is deferred; TESTED.md records nothing for this key yet.
refresh_fixed_tiles = 40

# Force dithering (true/false)
force_dither = false

# Grab input focus (true/false)
grab_input = true

# D-pad mode: "cross" or "relative".
#   cross    - four fixed zones around the centre of the drawn cross. This is
#              the default because the faceplate *draws* an absolute cross, and
#              the drawn UI has to match the input model: the user could not
#              steer at all in relative mode and could immediately in cross.
#   relative - steer from wherever the finger first touched, thumb-pad style.
#              Needs a drag, which a drawn cross gives no hint of.
dpad_mode = cross

# D-pad deadzone in pixels
dpad_deadzone = 24

# D-pad hysteresis in pixels
dpad_hysteresis = 10

# Hardware buttons for A and B, as evdev key codes. The built-in defaults are
# 193 and 194 (KEY_F23/KEY_F24), the two page-turn buttons measured on a Kobo
# Libra 2 -- they ship as a starting guess so a first run is playable on a device
# nobody has tested, including one with no page-turn buttons at all.
# Set either to 0 to run first-run calibration on the next launch: koboy asks you
# to press the button you want as A, then B, and rewrites these lines. That prompt
# can be dismissed by tapping the screen, which keeps the defaults -- otherwise a
# touch-only Kobo would be stuck on a question it cannot answer.
# Never set either to 116 (KEY_POWER): power is the quit key.
# key_a = 193
# key_b = 194

# Path to Game Boy ROM file
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` uses elsewhere in this file -- not
# against the current directory, which a NickelMenu or KFMon launch does not
# set.
# rom =

# Directory the ALL GAMES list scans (recursively). Only used when `rom` is
# unset: an explicit rom= skips the startup MAIN MENU entirely and loads that
# file. With `rom` unset, koboy starts on a MAIN MENU (RECENT / ALL GAMES /
# QUIT) rather than going straight to this list.
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` uses elsewhere in this file -- not
# against the current directory, which a NickelMenu or KFMon launch does not
# set.
rom_dir = roms

# Path to libretro core library.
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, NOT against the current directory -- so this works however
# koboy is launched (NickelMenu, KFMon, or a shell in any directory). Write a
# path containing a "/" if you want it honoured literally instead.
core = gambatte_libretro.so

# Directory for save files
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` above -- not against the current
# directory, which a NickelMenu or KFMon launch does not set.
save_dir = .
