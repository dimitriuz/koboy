# koboy default configuration
# Each key can be set to override the default values

# Display scale (0 = auto-fit to the largest integer scale that fits the panel
# ABOVE THE CONTROLS -- the drawn d-pad, A/B and Start/Select need their own
# band, and a rect fitted to the bare panel covered them while their touch zones
# stayed live underneath, so tapping the lower playfield pressed A)
#
# THE 5 BELOW DOES NOT COUNT AS ASKING. 5 is KOBOY_SCALE_LEGACY_DEFAULT and
# config_load treats a file naming exactly it as one nobody edited, so every
# system still auto-fits and still takes its measured per-system ceiling (see
# `ceiling` in src/config.c). Write any other number here and it wins: on the
# DMG faceplate as an integer scale, and in the LCD strip as a cap of N times
# the source, since that layout's fit is fractional and has no integer step to
# take.
scale = 5

# Core frames per presented frame. Also reachable in game, as MENU -> FRAMES,
# which cycles 1, 2, 3, 4, 6, 8 and writes the chosen value back here -- one
# setting, two doors, same key.
#
# The core is paced at its own rate regardless, so this does not change how
# fast a game runs; it changes how many UPDATES the panel gets. E-ink residue
# accumulates per update, not per second, so a higher number smears less and
# moves more choppily.
#
# MEASURED on a Libra 2 (Darkwing Duck, 600 core frames per run, wall clock
# 10.24-10.27s in every case -- the emulation cost of this setting is nil):
#
#   divisor    1     2     3     4     6     8    12
#   presented 115   102    76    67    49    39    31
#   fps      11.2   9.9   7.4   6.5   4.8   3.8   3.0
#
# The owner judged 2 "the same or even worse" on the panel than 3, which is
# why the menu's ladder goes ABOVE the default -- nothing above 3 had ever
# been tried. 8 is the top because past it the delivered rate barely moves:
# going 8 -> 12 halves what is requested and removes 8 presented frames in ten
# seconds, since a wider gap means fewer of the frames it does present are
# duplicates the dirty-rect pass would have thrown away.
#
# Valid range is 1 to 8. A value outside it -- or a non-numeric one -- is
# REJECTED and this default stands, rather than being clamped: clamping a
# typo'd 0 down to 1 would hand you the worst-smearing setting there is, and
# clamping a 100000 down to 8 would invent an intent you did not express.
# Off-ladder values inside the range (5, 7) run as written; the menu cycles
# from them to the next ladder entry up.
present_divisor = 3

# Presented frames between game-rect cleanups (0 or less disables).
# DISABLED BY DEFAULT, and deliberately so rather than by oversight. This and
# full_refresh_permille below both exist to schedule a flashing GC16, which was
# necessary when the fast waveform was a forced DU4: DU4 cannot erase, so
# residue built up and only a flash cleared it. With waveform_fast = auto the
# EPDC driver inspects each region's real pixel transitions and already picks a
# waveform that can erase when one is needed, which makes both redundant.
# Measured on a Libra 2: in one traced run, 35 AUTO refreshes on small rects
# flashed not once, while all 21 flashes came from the old 450-permille
# threshold below -- and no scheduled cleanup ever fired. With both off, a full
# game played with no flashing at all and only slight ghosting.
# Raise this if you want the periodic flash back; 60 was the old default and is
# roughly 2.4s at ~25fps.
cleanup_interval = 0

# Wall-clock ceiling between cleanups, in milliseconds (0 or less disables).
# Only relevant if you re-enable the cleanup above. It exists because
# cleanup_interval alone cannot promise any particular schedule: unchanged
# frames are suppressed by the dirty-rect pass, and 70s of measured Tetris
# gameplay presented only 45 frames -- so 60 presented frames is ~90s and a
# short session would never clean at all. Whichever limit trips first wins.
cleanup_max_ms = 0

# Waveform for fast (per-frame) refreshes: "auto", "du4" or "du".
#   auto - let the EPDC driver pick. It inspects the actual pixel transitions in
#          each update region, so it knows when an update is *erasing* (dark to
#          light) and needs a waveform capable of it. This is why the falling
#          piece left a second copy of itself behind under forced du4.
#   du4  - force the fast non-flashing FOUR-level waveform. Measurably quicker
#          to submit, but it cannot erase, so trails accumulate until a
#          cleanup. This is the setting that lost to auto on the reference
#          panel; it is kept because the measurement was one device.
#   du   - force the fast non-flashing TWO-level waveform. Only interesting
#          together with force_dither = true, and the two are ONE row in the
#          in-game menu for that reason -- see MOTION below.
#
# DU IS NOT A SMALLER DU4. FBInk's own header describes it as "from any to B&W"
# and, decisively, "on-screen pixels will be left as-is for new content that is
# *not* B&W". Read against koboy's four-level output that means every pixel
# whose new value is one of the two MIDDLE greys is a pixel the panel declines
# to touch -- which is what "cannot erase" looks like from the inside, and why
# forcing a fast waveform at four-level content failed here. Give it content
# that is genuinely two-valued and there is no transition left half-done.
#
# UNPROVEN ON A PANEL. Nobody has yet judged du + force_dither in motion; the
# in-game MOTION row exists so that judgement can be made without a relaunch.
waveform_fast = auto

# Dirty area, in permille of the game rect, at or above which a frame is
# refreshed with the full (flashing) waveform instead of the fast one.
# Measured against the TOTAL area of every rect a frame emits (up to
# KOBOY_MAX_RECTS of them, since Task 13), not one merged box. These rects
# are NOT guaranteed disjoint (a capped merge can leave one containing
# another -- see the comment above the merge-cap in video_split_dirty,
# src/video.c), so summed area is not simply bounded by the game rect's area
# through non-overlap. It is still bounded, for a different reason: the split
# branch only ever fires when Sum(tiles_i) < tiles_merged (strict). For the
# shipped default (the Game Boy core: game_w = 160*scale, game_h = 144*scale,
# always multiples of 8/KOBOY_TILE) that bound is exact:
# Sum(area_i) <= 64*Sum(tiles_i) < 64*tiles_merged <= game_w*game_h -- a core
# whose max_w/max_h are not themselves multiples of 8 (src/config.c now
# derives game_w/game_h from the core's geometry, not a 160x144 constant)
# only loses the LAST inequality by at most one edge tile's worth of slack,
# so the practical conclusion below still stands, but is no longer a proof
# for every possible core the way it is for this one. So
# 1000 still means "the promotion fires only when the summed dirty area
# covers the game rect corner to corner" -- reachable only via the single
# merged rect (empirically confirmed: the max summed area measured across a
# large randomised sweep was exactly game_w*game_h, and only the merged-rect
# path produced it). That is reachable -- a full-screen wipe or a scene
# transition produces exactly it -- but normal gameplay essentially never
# does, and when the whole rect really has changed a flashing refresh is what
# you want. (Only *exceeding* the rect is impossible, so 1001 and up would be
# a true never.)
# This threshold, not the cleanup above, was the measured source of the flashing
# users complained about: every flash in a traced run came from it. It was
# written for forced DU4, which cannot erase; AUTO can, so the promotion has
# nothing left to fix. Lower it (450 was the old default) only if you can
# actually see residue the driver failed to clear.
full_refresh_permille = 1000

# The fixed per-refresh cost, expressed in 8x8 tiles, used to decide whether
# splitting one dirty rectangle into several is cheaper than refreshing their
# merged bounding box. Refresh cost on e-ink is roughly `fixed + area`, so a
# sprite in one corner and a status bar in another merge into a near-full-rect
# refresh whose interior never changed.
# This is a config key rather than a constant because every absolute timing
# figure this project has measured moved by up to a factor of 2.2 between
# sessions. Raise it to split less; a very large value never splits.
# NOTE: this does nothing for a full-screen scroller. That case is the panel's
# answer, not the algorithm's, and no rectangle strategy improves it.
# UNVALIDATED ON HARDWARE: 40 is a starting guess, not a measurement -- see
# the note beside refresh_fixed_tiles in config_defaults (src/config.c). The
# on-device tuning run (koboy.log's `stages` line and `rects` count at
# 20/40/80) is deferred; TESTED.md records nothing for this key yet.
refresh_fixed_tiles = 40

# How a COLOUR frame reduces to the four greys this panel can show.
# Four of the six systems koboy runs are colour, and colour is most of the
# library, so this is the single setting that changes the most of what you see.
# Also reachable in-game: MENU -> GREYSCALE cycles the values and writes the
# choice back here, so you can compare them on the real panel.
#
#   luma      Rec.601 (77,150,29). What koboy v1 shipped. Correct for a
#             backlit screen and wrong for this one: blue is weighted 29/256,
#             so a bright blue sky lands on the DARKEST level. Sonic Pocket
#             Adventure's sky and Castlevania's both go near-black.
#   bright    Rec.601 weights, but with the shadows lifted so a dark-but-
#             coloured background stops collapsing into solid black.
#   balanced  (81,118,57) + the same lift. DEFAULT. Blue weighted about twice
#             Rec.601's, which is what actually fixes the skies, while keeping
#             enough green weight that a blue sprite stays a level apart from
#             a blue sky. Chosen by rendering 38 gameplay frames from 19 NES /
#             WonderSwan Color / Neo Geo Pocket Color titles and looking.
#   equal     (85,85,86) + lift. The most blue lift there is. Brightest skies;
#             costs you some separation between similar blues.
#   value     max(R,G,B). "As bright as it reads." Line art and text stay
#             crisp; large sprites lose their internal shading -- measured at
#             77% white on one title. An option, not a recommendation.
#
# The Game Boy is unaffected by ALL of these: its palette is neutral grey, and
# every mapping here is the identity on neutral grey, so its four shades land
# on the same four levels whichever you pick. Verified, not assumed.
gray_map = balanced

# Honour the pixel aspect a core reports (default true).
#
# Most systems koboy runs do NOT have square pixels: the Atari 2600 is about
# 1.6:1 (it renders 1.75x too tall without this), NES and Master System are
# 8:7, Game Gear 6:5, and most arcade boards have their own. Correcting them
# means scaling the two axes by different amounts, which is what makes a
# picture the right SHAPE at the cost of no longer being a whole number of
# panel pixels per source pixel.
#
# It is a key, and not simply always on, because turning it on changed the
# presentation of eight systems at once and NONE of that has been judged on a
# real e-ink panel. If non-integer scaling turns out to read badly here --
# uneven sprite edges, shimmering text -- set this false and every system goes
# back to the square-pixel presentation that shipped before. The Game Boy and
# Game & Watch are unaffected either way: their pixels already are square.
pixel_aspect = true

# Render the picture as 1-BIT, dithered, instead of four greys (default false).
#
# The pipeline normally quantises to the four levels the panel can hold. With
# this on it thresholds against a 16x16 Bayer matrix instead, so the only two
# values that ever reach the framebuffer are 0x00 and 0xFF and apparent greys
# come from the pattern. Dithering to 1-bit is the standard way to get greys at
# partial-refresh speed on e-ink, and it is the other half of waveform_fast =
# du above: a two-level waveform can complete every transition two-valued
# content asks for, and cannot complete the ones four-level content asks for.
#
# The pair is one row in the in-game menu -- MENU -> MOTION -- which cycles
#   4 GREYS / AUTO   (this default: four greys, driver picks the waveform)
#   1-BIT / AUTO     (the control: is the dithering alone doing the work?)
#   1-BIT / DU       (the hypothesis: two-valued content, two-level waveform)
# and writes both keys back here. The menu is the only honest way to choose:
# e-ink residue is panel-side, so no measurement koboy can take -- frame
# counts, dirty rects, per-stage timings -- can see the difference this is for.
# The file may hold any combination of the two keys; the ladder is what the
# menu offers, not what this file permits.
#
# The Game Boy loses the most from this (its four shades are already exactly
# the panel's four levels, so dithering can only approximate what it had) and
# a colour system in motion has the most to gain. Judge it per system.
force_dither = false

# Grab input focus (true/false)
grab_input = true

# D-pad mode: "cross" or "relative".
#   cross    - four fixed zones around the centre of the drawn cross. This is
#              the default because the faceplate *draws* an absolute cross, and
#              the drawn UI has to match the input model: the user could not
#              steer at all in relative mode and could immediately in cross.
#   relative - steer from wherever the finger first touched, thumb-pad style.
#              Needs a drag, which a drawn cross gives no hint of.
dpad_mode = cross

# D-pad deadzone in pixels
dpad_deadzone = 24

# D-pad hysteresis in pixels
dpad_hysteresis = 10

# Hardware buttons for A and B, as evdev key codes. The built-in defaults are
# 193 and 194 (KEY_F23/KEY_F24), the two page-turn buttons measured on a Kobo
# Libra 2 -- they ship as a starting guess so a first run is playable on a device
# nobody has tested, including one with no page-turn buttons at all.
# Set either to 0 to run first-run calibration on the next launch: koboy asks you
# to press the button you want as A, then B, and rewrites these lines. That prompt
# can be dismissed by tapping the screen, which keeps the defaults -- otherwise a
# touch-only Kobo would be stuck on a question it cannot answer.
# Never set either to 116 (KEY_POWER): power is the quit key.
# key_a = 193
# key_b = 194

# Path to Game Boy ROM file
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` uses elsewhere in this file -- not
# against the current directory, which a NickelMenu or KFMon launch does not
# set.
# rom =

# Directory the ALL GAMES list scans (recursively). Only used when `rom` is
# unset: an explicit rom= skips the startup MAIN MENU entirely and loads that
# file. With `rom` unset, koboy starts on a MAIN MENU (RECENT / ALL GAMES /
# QUIT) rather than going straight to this list.
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` uses elsewhere in this file -- not
# against the current directory, which a NickelMenu or KFMon launch does not
# set.
rom_dir = roms

# Path to libretro core library.
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, NOT against the current directory -- so this works however
# koboy is launched (NickelMenu, KFMon, or a shell in any directory). Write a
# path containing a "/" if you want it honoured literally instead.
#
# COMMENTED OUT ON PURPOSE, and it must stay that way in the shipped file.
# Setting this key at all is what koboy reads as "the user picked a core", and
# an explicit pick DISABLES the choice-by-extension that lets .mgw files reach
# the Game & Watch core -- so a file that merely restated the default here
# would have quietly pinned every ROM to gambatte on every install. Uncomment
# it only to force one core for everything.
#core = gambatte_libretro.so

# Directory for save files
# A bare name with no "/" is resolved against the directory containing the
# koboy executable, exactly like `core` above -- not against the current
# directory, which a NickelMenu or KFMon launch does not set.
save_dir = .
