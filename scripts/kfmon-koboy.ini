; koboy -- KFMon watch, an alternative to the NickelMenu entry.
;
; Install: copy this file to /mnt/onboard/.adds/kfmon/config/koboy.ini, and put
; a cover image at the path named below (any PNG will do; it shows up in the
; library and opening it launches koboy). Both are needed: KFMon watches the
; image, not this file.
;
; The image deliberately lives outside .adds/, which is why the koboy archive
; does not ship it -- the archive writes nothing but .adds/koboy/, so unzipping
; it can never touch anything the firmware cares about.
[watch]
filename = /mnt/onboard/koboy.png
action = /mnt/onboard/.adds/koboy/koboy.sh
label = koboy
hidden = 0
; block_spawns: koboy owns the framebuffer and every input node while it runs.
; A second script launched underneath it would fight for both.
block_spawns = 1
; Nickel's database is left alone. The icon shows up on the next library rescan.
do_db_update = 0
